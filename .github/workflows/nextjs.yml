
name: Deploy Framepath Website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/framepath"
        run: npm run build

      - name: Fix static asset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("out")
          prefix = b"/framepath"
          pattern = re.compile(
              rb"(?<![A-Za-z0-9_./-])/assets/"
          )

          count = 0

          for file in root.rglob("*"):
              if not file.is_file():
                  continue

              if file.suffix not in {
                  ".html", ".css", ".js",
                  ".json", ".xml", ".txt",
              }:
                  continue

              original = file.read_bytes()
              updated, n = pattern.subn(
                  prefix + b"/assets/",
                  original,
              )

              if n:
                  file.write_bytes(updated)
                  count += n

          print(f"Updated {count} asset references")
          PY

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
